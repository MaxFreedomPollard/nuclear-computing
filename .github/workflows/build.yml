name: reproduce
on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: regenerate figures
        run: python figures/make_figures.py
      - name: screen every isomer (cached IAEA data in gates/data)
        run: python gates/isomer_screen.py
      - name: run the transport gate demonstrations
        run: python transport/gate_demos.py
      - name: run the degree checker
        run: python transport/degree_check.py
      - name: run the compiler demonstration
        run: python transport/compiler_demo.py
      - name: compute the EDM channel plan
        run: python gates/edm_plan.py
      - name: run the digital twin
        run: python simulator/nuclear_ising.py
      - name: run the component proofs of concept
        run: python simulator/components.py
      - name: draw the nuclear transistor
        run: python transistor/make_transistor_figure.py
      - name: draw the datasheet curves
        run: python transistor/make_datasheet_figure.py
      - name: compute the ampoule
        run: python transistor/sealed_unit.py
      - name: report the neutron gate from the committed tallies (OpenMC itself runs in openmc.yml)
        run: python neutron/report.py
      - name: run the photon keystone census from the committed level schemes (no network)
        run: python photon/census.py
      - name: report the ampoule from the committed tallies (no OpenMC, no network)
        run: python ampoule/report.py
      - name: compile the instance onto the measured vessel and close its timing
        run: python ampoule/compile.py
      - name: rebuild index.html
        run: python build_html.py
      - name: run the tests (prose against computed numbers, links, style, physics, the manifest)
        run: pip install pytest && python -m pytest -q tests
      - name: verify that every number, table and vector figure came back byte for byte
        run: |
          changed=$(git status --porcelain --untracked-files=all | grep -v -i '\.png$' || true)
          if [ -n "$changed" ]; then
            echo "the tree is not the same after regeneration:"; echo "$changed"
            git --no-pager diff --stat -- . ':(exclude)*.png'
            echo "what moved in the text outputs:"
            git --no-pager diff -- '*.md' '*.csv' '*.txt' '*.json' '*.cff' | head -300
            exit 1
          fi
          echo "the tree is the same after regeneration"
